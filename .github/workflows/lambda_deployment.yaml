name: AWS Lambda Deploy using OIDC

on:
  push:
    branches: [ main ]

permissions:
  id-token: write   # 🔴 MUST for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials via OIDC
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::924210590962:role/OIDC
          aws-region: us-east-1
          audience: sts.amazonaws.com
          output-env-credentials: true

      # Step 3: List repo files (optional, for debugging)
      - name: List repo files
        run: ls -R

      # Step 4: Check src folder contents
      - name: List src folder
        run: ls -R src

      # Step 5: Zip Lambda function
      - name: Zip Lambda function
        run: zip -j function.zip src/lambda_function.py

      # Step 6: Check zip contents (optional)
      - name: Check zip contents
        run: unzip -l function.zip

      # Step 7: Update Lambda function
      - name: Update Lambda function code
        run: aws lambda update-function-code --function-name Test_for_OIDC --zip-file fileb://function.zip

      # Step 8: Verify Lambda update
      - name: Verify Lambda update
        run: aws lambda get-function --function-name Test_for_OIDC
