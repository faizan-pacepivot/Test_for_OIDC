name: AWS Lambda Deploy using OIDC

on:
  push:
    branches: [ main ]

permissions:
  id-token: write   # 🔴 MUST
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Configure AWS Credentials via OIDC
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::924210590962:role/OIDC
          aws-region: us-east-1
          audience: sts.amazonaws.com
          output-env-credentials: true

      # Step 3: List files for debugging (optional)
      - name: List repo files
        run: ls -R

      # Step 4: Zip Lambda code (src/lambda_function.py)
      - name: Zip Lambda function
        run: zip -j function.zip src/lambda_function.py

      # Step 5: Update Lambda function
      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name Test_for_OIDC \
