name: AWS Lambda Deploy using OIDC

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::924210590962:role/OIDC
          aws-region: us-east-1
          audience: sts.amazonaws.com
          output-env-credentials: true

      # --- Loop for multiple Lambda functions ---
      - name: Deploy all Lambda functions
        run: |
          # Campaign 1
          zip -j SD-Audience.zip src/SD-Audience/lambda_function.py
          aws lambda update-function-code --function-name SD-Audience --zip-file fileb://SD-Audience.zip

          # Campaign 2
          zip -j SD-Contextual-Category.zip src/SD-Contextual-Category/lambda_function.py
          aws lambda update-function-code --function-name SD-Contextual-Category --zip-file fileb://SD-Contextual-Category.zip


      - name: Verify Lambda updates
        run: |
          aws lambda get-function --function-name SD-Audience
          aws lambda get-function --function-name SD-Contextual-Category
          aws lambda get-function --function-name Single_Asin_Multi_Product
          aws lambda get-function --function-name Single_Assign_Single_Keywords
          aws lambda get-function --function-name Single_Asin_Single_Product
          aws lambda get-function --function-name Multi_asin_Multi_Keywords
          aws lambda get-function --function-name Multi_Asin_Multi_Product
          aws lambda get-function --function-name Single_Assign_Multi_Keyword

        
